name: Profile stats

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_svgs.py"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate trophies + commit activity SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: Rudra-Patel-CS
          OUT_DIR: assets
        run: python scripts/generate_profile_svgs.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophies.svg assets/activity.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
