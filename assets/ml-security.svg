<svg xmlns="http://www.w3.org/2000/svg" width="764" height="400" viewBox="0 0 764 400" role="img" aria-label="Venn diagram: Machine Learning intersecting Cybersecurity" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="mlG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5CD6FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5CD6FF" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="secG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3DD68C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3DD68C" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="coreG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB020" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipML"><circle cx="310" cy="190" r="150"/></clipPath>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1F2A36" stroke-width="0.6"/>
    </pattern>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace; }
    .title { font-size: 13px; font-weight: 700; letter-spacing: 2.5px; }
    .item  { font-size: 11px; fill: #C8D4E0; }
    .core  { font-size: 11px; fill: #FFD080; font-weight: 700; }
    .dim   { font-size: 10px; fill: #6B7C8F; }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="763" height="399" rx="14" fill="#0B0F14" stroke="#1F2A36"/>
  <rect x="1" y="1" width="762" height="398" rx="14" fill="url(#grid)" opacity="0.6"/>

  <!-- title bar -->
  <circle cx="26" cy="26" r="4" fill="#FF5F56"/><circle cx="42" cy="26" r="4" fill="#FFBD2E"/><circle cx="58" cy="26" r="4" fill="#27C93F"/>
  <text x="80" y="30" font-size="12" fill="#FFB020" font-weight="700">ml_x_security.viz</text>
  <text x="738" y="30" text-anchor="end" class="dim">focus: ML × Security</text>
  <line x1="16" y1="44" x2="748" y2="44" stroke="#1F2A36"/>

  <!-- circles -->
  <circle cx="310" cy="198" r="150" fill="url(#mlG)" stroke="#5CD6FF" stroke-width="1.6">
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="454" cy="198" r="150" fill="url(#secG)" stroke="#3DD68C" stroke-width="1.6">
    <animate attributeName="stroke-opacity" values="1;0.55;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- intersection glow (lens) -->
  <g clip-path="url(#clipML)" transform="translate(0,8)">
    <circle cx="454" cy="190" r="150" fill="url(#coreG)"/>
    <circle cx="454" cy="190" r="150" fill="none" stroke="#FFB020" stroke-width="1.6" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orbiting scanner along ML circle -->
  <circle r="3.5" fill="#5CD6FF">
    <animateMotion dur="9s" repeatCount="indefinite" path="M160,198 a150,150 0 1,1 300,0 a150,150 0 1,1 -300,0"/>
  </circle>
  <circle r="3.5" fill="#3DD68C">
    <animateMotion dur="9s" repeatCount="indefinite" path="M604,198 a150,150 0 1,0 -300,0 a150,150 0 1,0 300,0"/>
  </circle>

  <!-- circle titles -->
  <text x="236" y="76" text-anchor="middle" class="title" fill="#5CD6FF">MACHINE LEARNING</text>
  <text x="528" y="76" text-anchor="middle" class="title" fill="#3DD68C">CYBERSECURITY</text>

  <!-- ML only -->
  <g text-anchor="middle">
    <text x="232" y="160" class="item">feature design</text>
    <text x="232" y="186" class="item">supervised learning</text>
    <text x="232" y="212" class="item">model evaluation</text>
    <text x="232" y="238" class="item">data pipelines</text>
  </g>

  <!-- Security only -->
  <g text-anchor="middle">
    <text x="532" y="160" class="item">vulnerability classes</text>
    <text x="532" y="186" class="item">exploitation</text>
    <text x="532" y="212" class="item">threat modeling</text>
    <text x="532" y="238" class="item">secure coding</text>
  </g>

  <!-- intersection -->
  <g text-anchor="middle">
    <text x="382" y="128" class="core" font-size="10" letter-spacing="2">// INTERSECTION</text>
    <text x="382" y="164" class="core">anomaly detection</text>
    <text x="382" y="190" class="core">intrusion detection</text>
    <text x="382" y="216" class="core">malware &amp; phishing</text>
    <text x="382" y="242" class="core">adversarial ML</text>
    <circle cx="382" cy="266" r="4" fill="#FFB020">
      <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- flanking annotations -->
  <g class="dim">
    <text x="24" y="150">in: data</text>
    <text x="24" y="170">→ features</text>
    <text x="24" y="190">→ models</text>
    <text x="740" y="150" text-anchor="end">out: defense</text>
    <text x="740" y="170" text-anchor="end">detect ←</text>
    <text x="740" y="190" text-anchor="end">respond ←</text>
  </g>

  <!-- pipeline footer -->
  <line x1="16" y1="368" x2="748" y2="368" stroke="#1F2A36"/>
  <text x="382" y="388" text-anchor="middle" class="dim">data → features → model → detect → respond  ·  <tspan fill="#FFB020">break it, then learn to catch it</tspan></text>
</svg>
